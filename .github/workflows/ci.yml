name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node20 leaves the runners on 2026-09-23. Forcing the Node24 runtime now
  # proves every action in this pipeline already works on it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/e2e-exec-playwright

jobs:
  # Stage: build
  #
  # Builds the execution image every other job runs inside, so the test jobs
  # start with browsers and dependencies already present instead of installing
  # them three times over. The tag carries the Playwright version and a hash of
  # the dependency manifests: any change to either produces a new tag, which is
  # what keeps a job from running against an image whose node_modules no longer
  # match the lockfile.
  prepare-playwright-image:
    name: prepare-playwright-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: meta
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          deps=$(cat package.json yarn.lock | sha256sum | cut -c1-12)
          image="${REGISTRY}/${IMAGE_NAME}:v${version}-${deps}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          echo "Image: ${image,,}"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: env/docker/e2e-playwright.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage: check
  static-checks:
    name: static-checks
    needs: prepare-playwright-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # Lint findings are uploaded to code scanning, which annotates them on the
      # pull request diff. A red job says something is wrong; an annotation says
      # which line.
      security-events: write
    container:
      image: ${{ needs.prepare-playwright-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installed dependencies at /workspace; the checkout lands
      # elsewhere, so the job points at them rather than installing again.
      - name: Link dependencies from the image
        run: ln -s /workspace/node_modules node_modules

      - name: TypeScript
        run: yarn typecheck:ci

      # Two runs on purpose. The SARIF formatter writes to a file, so a run
      # that only produces SARIF fails with an empty log and leaves whoever
      # opens it no idea which rule fired. The readable run is the gate; the
      # SARIF run feeds code scanning. Both use continue-on-error so the
      # findings still reach the Security tab when the code is failing, and the
      # gate is restored by the last step in this job.
      - name: ESLint
        id: eslint
        continue-on-error: true
        run: yarn lint:ci

      - name: ESLint report for code scanning
        if: always()
        continue-on-error: true
        run: yarn lint:sarif

      - name: Upload lint findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: reports/eslint.sarif
          category: eslint

      - name: Prettier
        run: yarn stylecheck:ci

      - name: Fail if ESLint reported problems
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "::error::ESLint reported problems. See the Security tab or the annotations on this pull request."
          exit 1

  # Stage: end2end
  #
  # One definition, one job per engine. The matrix is what GitHub Actions offers
  # for this and what Playwright's CI guidance uses: each entry gets its own
  # runner, so the engines run in parallel rather than trebling the wall clock
  # of a single job.
  #
  # WebKit only appears on merge. Rendering differences are not the feedback a
  # review needs within seconds, and dropping it from pull requests cuts each
  # one to half the executions. The list is built from the event rather than
  # guarded with `if`, because a matrix entry that exists and is skipped still
  # shows as a box in the graph and still has to be reasoned about.
  #
  # `include` is deliberately not used to carry the engine label. An include
  # entry that matches nothing in the base list does not vanish, it adds a
  # combination, so on a pull request it would put WebKit back.
  e2e:
    name: ${{ matrix.project }}
    needs: [prepare-playwright-image, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      # One engine failing is a result about that engine, not a reason to throw
      # away what the other already produced.
      fail-fast: false
      matrix:
        project: ${{ github.event_name == 'pull_request' && fromJSON('["e2e-chromium"]') || fromJSON('["e2e-chromium","e2e-webkit"]') }}
    container:
      image: ${{ needs.prepare-playwright-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installed dependencies at /workspace; the checkout lands
      # elsewhere, so the job points at them rather than installing again.
      - name: Link dependencies from the image
        run: ln -s /workspace/node_modules node_modules

      # One worker per engine. The budget is a precaution rather than a measured
      # limit: one run failed with six browser instances against the shared demo
      # host, while later runs passed with roughly twelve from several pull
      # requests at once. The host's capacity is variable rather than a clean
      # threshold, and keeping the budget removes the suite as a suspect when
      # something does time out.
      - name: Run the functional suite
        env:
          E2E_BROWSERS: ${{ matrix.project == 'e2e-webkit' && 'WebKit' || 'Chromium' }}
          E2E_VIEWPORT: 1920x1080
        # npx, not yarn: this job runs on the image node_modules through a
        # symlink and never installs, so yarn has no install state to verify.
        run: npx playwright test --project=${{ matrix.project }} --workers=1

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 7

      # Blob is the format merge-reports consumes, so the published HTML report
      # carries the traces for every engine, not only the canonical one.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 7

      # Playwright's JSON report is the only one that states flaky as an
      # outcome, so it is what the suite health page is built from.
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-json-${{ matrix.project }}
          path: reports/results.json
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-traces
          path: test-results
          retention-days: 7

  visual-regression:
    name: visual-regression
    needs: [prepare-playwright-image, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-playwright-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Link dependencies from the image
        run: ln -s /workspace/node_modules node_modules

      # Baselines are committed from this same platform. Without them Playwright
      # would write new ones and report success, so their absence is a failure
      # rather than a silently self-seeded green run.
      - name: Verify Linux baselines exist
        run: |
          count=$(find vr-tests -name '*-linux.png' | wc -l)
          echo "Found $count Linux baselines"
          if [ "$count" -eq 0 ]; then
            echo "::error::No Linux baselines committed. Run yarn docker:vr:update and commit the result."
            exit 1
          fi

      - name: Run visual suite
        run: yarn test:vr --workers=1

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-vr
          path: allure-results
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-vr
          path: blob-report
          retention-days: 7

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-json-vr
          path: reports/results.json
          retention-days: 7

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7

  # The single check the branch protection requires.
  #
  # GitHub counts a skipped job as a satisfied requirement, so requiring the
  # test jobs directly would be hollow: the WebKit entry is absent on pull
  # requests by design, and any job that stops running would silently stop
  # being enforced. This job always runs, reads the results of the others, and
  # fails on anything that is not success or a deliberate skip. Adding a job
  # later means adding it here rather than editing repository settings.
  ci-gate:
    name: ci-gate
    needs: [static-checks, e2e, visual-regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of every job
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job reported '$result'"
              exit 1
            fi
          done
          echo "Every required job passed or was deliberately skipped."

  publish-dashboard:
    name: publish-dashboard
    needs: [e2e, visual-regression]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Corepack first: setup-node's yarn cache probe runs `yarn cache dir`
      # with the runner's global yarn 1, which refuses to run in a project that
      # pins yarn 4 through packageManager.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: yarn install --immutable

      - name: Collect functional results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-e2e-chromium
          path: results/functional

      - name: Collect visual results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-vr
          path: results/visual

      - name: Collect WebKit results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-e2e-webkit
          path: results/webkit

      # WebKit results join the functional ones instead of forming a report of
      # their own: the same twenty cases on a second engine belong under one
      # suite, not at a second address.
      #
      # Three reports are still generated rather than one. Allure draws a single
      # trend line per report, so a combined report could never show the visual
      # trend next to the functional one.
      #
      # categories.json classifies failures: a screenshot diff, a host 5xx and a
      # real assertion failure are three different conversations, and an
      # unclassified report makes them look like one. executor.json links a
      # published report back to the run that produced it.
      - name: Stage results
        run: |
          cp -r results/webkit/. results/functional/ 2>/dev/null || true

          mkdir -p results/combined
          cp -r results/functional/. results/combined/ 2>/dev/null || true
          cp -r results/visual/. results/combined/ 2>/dev/null || true

          write_meta() {
            dir=$1; label=$2; path=$3
            cp env/allure/categories.json "$dir/categories.json"
            cat > "$dir/executor.json" <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "$label",
            "buildOrder": ${{ github.run_number }},
            "buildName": "CI #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://ella79.github.io/agentic-playwright-suite/$path"
          }
          JSON
          }

          write_meta results/combined "Agentic Playwright Suite" ""
          write_meta results/functional "Functional E2E" "functional/"
          write_meta results/visual "Visual regression" "visual/"

          node utils/scripts/group-allure-packages.mjs             results/combined results/functional results/visual

      # Trend graphs only exist if the previous report's history is carried
      # forward, so each report restores its own from the published site.
      - name: Restore trend history
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add gh-pages-tmp origin/gh-pages
            if [ -f gh-pages-tmp/metrics/history.json ]; then
              mkdir -p previous-metrics
              cp gh-pages-tmp/metrics/history.json previous-metrics/history.json
              echo "Restored suite health history"
            fi

            for suite in combined functional visual; do
              case $suite in
                combined) source=gh-pages-tmp/history ;;
                *) source=gh-pages-tmp/$suite/history ;;
              esac
              if [ -d "$source" ]; then
                cp -r "$source" "results/$suite/history"
                echo "Restored history for $suite"
              else
                echo "No published history for $suite yet"
              fi
            done
          else
            echo "No gh-pages branch yet: this run seeds the history"
          fi

      - name: Generate the reports
        run: |
          yarn allure generate results/combined --clean -o allure-report
          yarn allure generate results/functional --clean -o allure-report/functional
          yarn allure generate results/visual --clean -o allure-report/visual

      - name: Collect JSON reports
        uses: actions/download-artifact@v8
        with:
          pattern: results-json-*
          path: json-reports

      # The suite health page is a different question from the Allure report:
      # not what this run found, but whether the suite is trustworthy and which
      # way it is moving. It deliberately repeats none of Allure's case level
      # detail.
      - name: Build the suite health page
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node utils/scripts/build-metrics.mjs             --suite functional=json-reports/results-json-e2e-chromium/results.json             --suite functional-webkit=json-reports/results-json-e2e-webkit/results.json             --suite visual=json-reports/results-json-vr/results.json             --history previous-metrics/history.json             --out allure-report/metrics

      # The HTML report is published alongside Allure because it carries the
      # traces: Allure shows what failed, the trace viewer shows why.
      - name: Collect blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports from both test jobs
        run: |
          yarn playwright merge-reports --reporter html ./all-blob-reports
          mv playwright-report allure-report/playwright-report

      # The portfolio page reads this report and publishes a contract naming
      # what it depends on. A report that no longer fits fails here, leaving the
      # previous dashboard up: stale but readable beats fresh but broken.
      #
      # Vendored rather than fetched at run time, because a pipeline that
      # executes a script from a URL is not a pattern worth showing, and a
      # vendored copy is visible in the diff. --expect-version fails a refreshed
      # copy nobody reviewed.
      - name: Verify the report against the consumer contract
        run: |
          node env/contract/verify-contract.mjs \
            --contract env/contract/allure-report.contract.json \
            --base ./allure-report \
            --expect-version 2

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: publish test dashboard for ${{ github.sha }}"
