name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node20 leaves the runners on 2026-09-23. Forcing the Node24 runtime now
  # proves every action in this pipeline already works on it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/e2e-exec-playwright

jobs:
  # Stage: build
  #
  # Builds the execution image every other job runs inside, so the test jobs
  # start with browsers and dependencies already present instead of installing
  # them three times over. The tag carries the Playwright version and a hash of
  # the dependency manifests: any change to either produces a new tag, which is
  # what keeps a job from running against an image whose node_modules no longer
  # match the lockfile.
  prepare-playwright-image:
    name: prepare-playwright-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: meta
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          deps=$(cat package.json yarn.lock | sha256sum | cut -c1-12)
          image="${REGISTRY}/${IMAGE_NAME}:v${version}-${deps}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          echo "Image: ${image,,}"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: env/docker/e2e-playwright.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage: check
  static-checks:
    name: static-checks
    needs: prepare-playwright-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-playwright-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installed dependencies at /workspace; the checkout lands
      # elsewhere, so the job points at them rather than installing again.
      - name: Link dependencies from the image
        run: ln -s /workspace/node_modules node_modules

      - name: TypeScript
        run: yarn typecheck:ci

      - name: ESLint
        run: yarn lint:ci

      - name: Prettier
        run: yarn stylecheck:ci

  # Stage: end2end
  e2e-playwright:
    name: e2e-playwright
    needs: [prepare-playwright-image, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-playwright-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Link dependencies from the image
        run: ln -s /workspace/node_modules node_modules

      - name: Run functional suite
        run: yarn test:e2e

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e
          path: allure-results
          retention-days: 7

      # Blob is the format merge-reports consumes, so the published HTML report
      # can hold both this job's run and the visual one's.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-e2e
          path: blob-report
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results
          retention-days: 7

  visual-regression:
    name: visual-regression
    needs: [prepare-playwright-image, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-playwright-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Link dependencies from the image
        run: ln -s /workspace/node_modules node_modules

      # Baselines are committed from this same platform. Without them Playwright
      # would write new ones and report success, so their absence is a failure
      # rather than a silently self-seeded green run.
      - name: Verify Linux baselines exist
        run: |
          count=$(find vr-tests -name '*-linux.png' | wc -l)
          echo "Found $count Linux baselines"
          if [ "$count" -eq 0 ]; then
            echo "::error::No Linux baselines committed. Run yarn docker:vr:update and commit the result."
            exit 1
          fi

      - name: Run visual suite
        run: yarn test:vr

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-vr
          path: allure-results
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-vr
          path: blob-report
          retention-days: 7

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7

  publish-dashboard:
    name: publish-dashboard
    needs: [e2e-playwright, visual-regression]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: yarn install --frozen-lockfile

      - name: Collect results from every test job
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: downloaded-results
          merge-multiple: true

      # categories.json classifies failures in the report: a screenshot diff, a
      # host 5xx and a real assertion failure are three different conversations,
      # and an unclassified report makes them look like one.
      # executor.json is what links a published report back to the run that
      # produced it.
      - name: Stage results
        run: |
          mkdir -p allure-results
          cp -r downloaded-results/. allure-results/ 2>/dev/null || true
          cp env/allure/categories.json allure-results/categories.json
          cat > allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Agentic Playwright Suite",
            "buildOrder": ${{ github.run_number }},
            "buildName": "CI #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://ella79.github.io/agentic-playwright-suite/"
          }
          JSON
          ls allure-results | head

      # Trend graphs only exist if the previous report's history is carried
      # forward, so it is restored from the published site before generating.
      - name: Restore trend history
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add gh-pages-tmp origin/gh-pages
            if [ -d gh-pages-tmp/history ]; then
              cp -r gh-pages-tmp/history allure-results/history
              echo "Restored history from the published dashboard"
            fi
          else
            echo "No gh-pages branch yet: this run seeds the history"
          fi

      - name: Generate Allure report
        run: yarn allure:generate

      # The HTML report is published alongside Allure because it carries the
      # traces: Allure shows what failed, the trace viewer shows why.
      - name: Collect blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports from both test jobs
        run: |
          npx playwright merge-reports --reporter html ./all-blob-reports
          mv playwright-report allure-report/playwright-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: publish test dashboard for ${{ github.sha }}"
