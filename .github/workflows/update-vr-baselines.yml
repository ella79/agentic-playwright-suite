name: Update VR baselines

# Visual baselines are platform-specific. A screenshot generated on a developer
# machine renders text differently from the CI runner and would never match, so
# the authoritative baselines are generated here, on the same platform that
# compares them, and committed from here.
#
# Run this deliberately, after verifying a visual change was intended.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the baselines are being regenerated"
        required: true
        type: string

jobs:
  update-baselines:
    name: Regenerate and commit baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Corepack first: setup-node's yarn cache probe runs `yarn cache dir`
      # with the runner's global yarn 1, which refuses to run in a project that
      # pins yarn 4 through packageManager.
      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: yarn

      - run: yarn install --immutable

      - name: Install Chromium
        run: yarn playwright:install:chromium

      - name: Regenerate baselines
        run: yarn test:vr:update

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vr-tests
          if git diff --staged --quiet; then
            echo "Baselines already current, nothing to commit"
            exit 0
          fi
          git diff --staged --stat
          git commit -m "test: regenerate visual baselines

          ${{ inputs.reason }}"
          git push

      - name: Upload the regenerated set for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-baselines
          path: vr-tests/**/*-snapshots/**
          retention-days: 14
